[project]
name = "crowdcast"
version = "0.1.0"
description = "CROWDCAST: event crowd congestion prediction (college CSE project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "onnxruntime>=1.32.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "shapely>=2.2.0",
    "networkx>=3.7",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "types-networkx>=3.6.1.20261119",
    "httpx>=0.28.1",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crowdcast", "tools"]

[tool.uv]
# Use uv's own Python build, not the Microsoft Store / system ones (see WORKFLOW.md session log 2026-11-20).
python-preference = "only-managed"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "DTZ", "RUF"]
# DTZ: forbid naive datetimes (CLAUDE.md §4: store UTC).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
# Generated by Alembic autogenerate; long SQL CHECK strings are kept verbatim.
"crowdcast/storage/migrations/versions/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["crowdcast", "tools", "tests"]

[[tool.mypy.overrides]]
# onnxruntime and shapely ship no type information.
module = ["onnxruntime", "onnxruntime.*", "shapely", "shapely.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: needs the PostgreSQL container running (docker compose up -d db)",
    "model: needs model weights in models/ (uv run python -m tools.vision.fetch_models)",
]
