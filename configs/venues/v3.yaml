# Reference topology V3 - exhibition (doc 12 §5.4: "grid of 6 halls + 2 corridors + 2 gates +
# food", 12 zones). HELD-OUT VENUE: its events are only ever used for the test-new-venue split.
# Format: doc 12 §6.1.
#
# ILLUSTRATIVE VALUES ONLY. Doc 12 fixes the description and the zone count (6 + 2 + 2 + food =
# 11, so a facilities zone is added to reach 12); the layout, areas, capacities, widths and
# travel times were invented for this file (WORKFLOW 5.2.3) and are placeholders.
format_version: 1
illustrative: true

venue:
  name: V3 Exhibition Centre (synthetic)
  rho_plan: 1.0
  plan_width: 1200
  plan_height: 800

zones:
  - {code: H1, name: Hall 1, type: EXHIBITION, area_m2: 900, capacity: 800,
     polygon: [[200, 80], [450, 80], [450, 300], [200, 300]]}
  - {code: H2, name: Hall 2, type: EXHIBITION, area_m2: 900, capacity: 800,
     polygon: [[475, 80], [725, 80], [725, 300], [475, 300]]}
  - {code: H3, name: Hall 3, type: EXHIBITION, area_m2: 900, capacity: 800,
     polygon: [[750, 80], [1000, 80], [1000, 300], [750, 300]]}
  - {code: H4, name: Hall 4, type: EXHIBITION, area_m2: 900, capacity: 800,
     polygon: [[200, 500], [450, 500], [450, 720], [200, 720]]}
  - {code: H5, name: Hall 5, type: EXHIBITION, area_m2: 900, capacity: 800,
     polygon: [[475, 500], [725, 500], [725, 720], [475, 720]]}
  - {code: H6, name: Hall 6, type: EXHIBITION, area_m2: 900, capacity: 800,
