# Solo scope (WORKFLOW.md): only PostgreSQL runs in Docker; the Python code runs natively.
# Start:  docker compose up -d db      Stop: docker compose stop db
# Credentials come from `.env` (copy `.env.example`); the defaults are for local development only.
services:
  db:
    image: postgres:16-alpine
    container_name: crowdcast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowdcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdcast}
      POSTGRES_DB: ${POSTGRES_DB:-crowdcast}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # bound to localhost only
    volumes:
      - crowdcast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdcast} -d ${POSTGRES_DB:-crowdcast}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crowdcast-pgdata:
